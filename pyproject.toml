[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebpf-rl-tcn-ips"
version = "1.0.0"
description = "An eBPF-Driven Deep Reinforcement Learning and TCN Framework for Intrusion Prevention"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "IPS Research Team" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "gymnasium>=0.29.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "streamlit>=1.30.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
